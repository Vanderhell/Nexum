name: Tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nexum-linux
          - os: windows-latest
            artifact: nexum-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref }}"}
      - name: Validate version tag and release inputs
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          test -f LICENSE
          test -f README.md
      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Test Release
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage package
        shell: bash
        run: |
          mkdir -p package/include package/docs package/lib
          cp include/*.h package/include/
          cp README.md LICENSE CHANGELOG.md package/
          cp docs/*.md package/docs/
          find build -type f \( -name 'libpnp.a' -o -name 'pnp.lib' \) -exec cp {} package/lib/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: package
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - name: Archive artifacts
        run: |
          for directory in artifacts/*; do tar -czf "$(basename "$directory").tar.gz" -C "$directory" .; done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tar.gz"
